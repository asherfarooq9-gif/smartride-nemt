# NOTE: neither workflow here produces a store/production release. Production
# APKs come only from .github/workflows/release.yml (signed with the release
# keystore). The Android artifact is a DEBUG build and the iOS one is AD-HOC.
workflows:
  patient-app-android:
    name: Patient App — Android DEBUG APK (not for release)
    max_build_duration: 30
    environment:
      flutter: 3.41.4
    scripts:
      - name: Get dependencies
        script: cd apps/patient_app && flutter pub get
      - name: Analyze
        script: cd apps/patient_app && flutter analyze
      - name: Build APK
        script: cd apps/patient_app && flutter build apk --debug
    artifacts:
      - apps/patient_app/build/app/outputs/flutter-apk/app-debug.apk

  patient-app-ios:
    name: Patient App — iOS AD-HOC IPA (internal testing, not for release)
    max_build_duration: 60
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.smartride.patientApp
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.smartride.patientApp
    scripts:
      - name: Get dependencies
        script: cd apps/patient_app && flutter pub get
      - name: Install pods
        script: cd apps/patient_app/ios && pod install
      - name: Build IPA
        script: |
          cd apps/patient_app
          # --release is the Flutter build mode; signing is ad_hoc, so this IPA
          # cannot be submitted to the App Store.
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - apps/patient_app/build/ios/ipa/*.ipa
