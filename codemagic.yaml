workflows:
  patient-app-android:
    name: Patient App — Android Debug APK
    max_build_duration: 30
    environment:
      flutter: 3.41.4
    scripts:
      - name: Get dependencies
        script: cd apps/patient_app && flutter pub get
      - name: Analyze
        script: cd apps/patient_app && flutter analyze
      - name: Build APK
        script: cd apps/patient_app && flutter build apk --debug
    artifacts:
      - apps/patient_app/build/app/outputs/flutter-apk/app-debug.apk

  patient-app-ios:
    name: Patient App — iOS IPA
    max_build_duration: 60
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.smartride.patientApp
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.smartride.patientApp
    scripts:
      - name: Get dependencies
        script: cd apps/patient_app && flutter pub get
      - name: Install pods
        script: cd apps/patient_app/ios && pod install
      - name: Build IPA
        script: |
          cd apps/patient_app
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - apps/patient_app/build/ios/ipa/*.ipa
