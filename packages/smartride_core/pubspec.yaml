name: smartride_core
description: Shared models, API client, design system, and utilities for SmartRide apps.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.4.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  dio: ^5.6.0
  flutter_dotenv: ^5.1.0
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^3.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
