# Production scrape config, mounted by docker-compose.prod.yml. Identical to
# prometheus.yml except /metrics is authenticated: the backend returns 401
# outside DEBUG without the bearer token.
#
# The token is read from /etc/prometheus/metrics_token, which compose mounts
# from $METRICS_TOKEN_FILE (a file holding the same value as the backend's
# METRICS_TOKEN, no trailing newline needed):
#   printf %s "$METRICS_TOKEN" > secrets/metrics_token
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: smartride-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend:8000"]
