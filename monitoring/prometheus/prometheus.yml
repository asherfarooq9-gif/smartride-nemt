global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: smartride-backend
    metrics_path: /metrics
    # Dev only: the dev backend runs with DEBUG=true, which leaves /metrics open.
    # Production uses prometheus.prod.yml (bearer token via credentials_file),
    # mounted by docker-compose.prod.yml.
    static_configs:
      - targets: ["backend:8000"]
