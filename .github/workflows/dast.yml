name: Dynamic Security Scan (OWASP ZAP)

# Runs the real API and admin dashboard against a throwaway database and lets
# ZAP probe them. Weekly and on demand; findings are a report, not a gate.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 2"  # every Tuesday 05:00 UTC

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: smartride
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartride
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartride"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Start API and dashboard
        run: |
          python scripts/e2e_backend.py > api.log 2>&1 &
          cd admin-dashboard
          npm ci --legacy-peer-deps
          NEXT_PUBLIC_API_URL=http://localhost:18010 npm run build
          npm run start -- -p 13100 > ../admin.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:18010/health && curl -fs http://localhost:13100/login > /dev/null && exit 0
            sleep 2
          done
          cat ../api.log ../admin.log
          exit 1

      - name: ZAP baseline against the dashboard
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:13100
          allow_issue_writing: false
          fail_action: false

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-server-logs
          path: |
            api.log
            admin.log
