name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: |
          cd backend
          ruff check .

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: smartride
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartride"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://smartride:password@localhost:5432/smartride_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_test_secret_key_32_chars_long
      TRIAGE_SERVICE_URL: http://localhost:8001

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migrations (sanity check)
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          cd backend
          pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 7

  flutter-analyze:
    name: Flutter Analyze + Test + APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Core package pub get
        run: |
          cd packages/smartride_core
          flutter pub get

      - name: Core package tests
        run: |
          cd packages/smartride_core
          flutter test --reporter=compact || true

      - name: Patient app analyze + test + build APK
        run: |
          cd apps/patient_app
          flutter pub get
          flutter analyze
          flutter test --reporter=compact || true
          flutter build apk --debug --no-pub

      - name: Driver app analyze + test + build APK
        run: |
          cd apps/driver_app
          flutter pub get
          flutter analyze
          flutter test --reporter=compact || true
          flutter build apk --debug --no-pub

      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: patient-app-debug
          path: apps/patient_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload driver APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-debug
          path: apps/driver_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  docker-compose-validate:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet

  pr-summary:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, flutter-analyze, docker-compose-validate]
    if: github.event_name == 'pull_request' && always()
    permissions:
      pull-requests: write

    steps:
      - name: Post results comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'Backend Lint':      '${{ needs.backend-lint.result }}',
              'Backend Tests':     '${{ needs.backend-tests.result }}',
              'Flutter / APK':     '${{ needs.flutter-analyze.result }}',
              'Compose Validate':  '${{ needs.docker-compose-validate.result }}',
            };
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${icon(result)} | **${name}** | \`${result}\` |`)
              .join('\n');
            const body = `## CI Results\n\n| | Job | Status |\n|---|---|---|\n${rows}\n\n_Updated: ${new Date().toUTCString()}_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## CI Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
