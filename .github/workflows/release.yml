name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # create the GitHub Release

jobs:
  # A tag can be pushed on any commit. Refuse to build and publish unless CI has
  # already passed on exactly this commit.
  require-green-ci:
    name: Require green CI
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check CI results for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100"             --jq '[.check_runs[] | select(.name != "Require green CI" and .name != "Build Release APKs")]')
          for name in "Backend Lint" "Backend Tests" "Triage Service Tests"                       "Admin Dashboard Lint + Typecheck + Build"; do
            result=$(echo "$runs" | jq -r --arg n "$name" '[.[] | select(.name == $n)][0].conclusion // "missing"')
            if [ "$result" != "success" ]; then
              echo "::error::CI check '$name' is '$result' on $GITHUB_SHA. Merge to main and wait for CI before tagging."
              exit 1
            fi
          done
          bad=$(echo "$runs" | jq -r '[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad CI check(s) on $GITHUB_SHA are failing or still running."
            exit 1
          fi

  build-release-apks:
    name: Build Release APKs
    needs: require-green-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle signs from android/key.properties (see app/build.gradle.kts) and the
      # app reads its API URL from the bundled .env. Exporting env vars alone did
      # neither, so earlier "release" APKs were silently debug-signed and pointed
      # at the emulator address. Secrets go through env, never into the script text.
      - name: Prepare signing key and app config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set; refusing to build an unsigned release"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.keystore" \
            > apps/patient_app/android/key.properties
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > apps/patient_app/.env
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > apps/patient_app/android/app/google-services.json
          fi

      - name: Core package pub get
        run: |
          cd packages/smartride_core
          flutter pub get

      - name: Build SmartRide release APK
        env:
          BUILD_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd apps/patient_app
          flutter pub get
          flutter build apk --release --no-pub \
            --build-name="${BUILD_NAME#v}" \
            --build-number="$BUILD_NUMBER"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SmartRide ${{ github.ref_name }}
          body: |
            ## SmartRide NEMT ${{ github.ref_name }}

            ### One unified app — patients and drivers in the same install

            Sign up as **Patient**, **Driver**, or **Both**. Switch portals from the drawer menu at any time.

            ### Install
            1. Download `smartride-release.apk`
            2. On your Android phone: Settings → Security → allow Unknown Sources
            3. Open the downloaded APK to install

            > Requires Android 6.0+
          files: |
            apps/patient_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

      # Hosted runners are discarded, but self-hosted or cached runners are not:
      # never leave the keystore, its passwords or the API config on disk.
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" \
            apps/patient_app/android/key.properties \
            apps/patient_app/.env \
            apps/patient_app/android/app/google-services.json
