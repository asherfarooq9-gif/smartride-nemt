# LOCAL DEVELOPMENT file. Datastore ports are published on 127.0.0.1 only, and
# secrets come from .env (cp .env.example .env). For production use
# docker-compose.prod.yml on top of this file.
services:

  postgres:
    # Tag + digest: the PostGIS patch tag does not exist for the alpine variant.
    image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    container_name: smartride_postgres
    environment:
      POSTGRES_USER: smartride
      # Dev default matches the test suite's TEST_DATABASE_URL; override in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: smartride
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartride"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine
    container_name: smartride_redis
    # No auth in dev (the test suite connects to redis://localhost:6379); loopback only.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smartride_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartride:${POSTGRES_PASSWORD:-password}@postgres:5432/smartride
      REDIS_URL: redis://redis:6379/0
      TRIAGE_SERVICE_URL: http://triage:8001
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (cp .env.example .env)}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # DEV ONLY: DEBUG=true opens /metrics and allows CORS "*". The prod override
      # forces DEBUG=false.
      DEBUG: ${DEBUG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  triage:
    build: ./ai-services/triage
    container_name: smartride_triage
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./ai-services/triage:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  admin_dashboard:
    build:
      context: ./admin-dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: smartride_admin
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  # Opt-in connection pooler. Start with:  docker compose --profile pooling up -d
  # Then point the backend at it: DATABASE_URL host -> pgbouncer:5432 and set
  # DB_DISABLE_PREPARED_CACHE=true (asyncpg + transaction pooling).
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: smartride_pgbouncer
    profiles: ["pooling"]
    environment:
      DB_HOST: postgres
      DB_USER: smartride
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_NAME: smartride
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      ADMIN_USERS: smartride
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: smartride_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - alertmanager

  # Routes alerts to people. The receiver in alertmanager.yml is a placeholder that
  # discards everything until you configure one (see docs/OBSERVABILITY.md).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: smartride_alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:11.1.0
    container_name: smartride_grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD (cp .env.example .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
