# Ruff configuration for the SmartRide backend.
line-length = 88
target-version = "py311"

[lint]
# Pinned explicitly: newer ruff releases widen the implicit default set, which
# would silently change what this CI gate enforces.
select = ["E4", "E7", "E9", "F", "W"]

[lint.per-file-ignores]
# Test modules and conftest intentionally set environment variables and adjust
# sys.path before importing the app, so module-level imports cannot all sit at
# the top of the file (E402).
"tests/*" = ["E402"]
"tests/conftest.py" = ["E402"]
