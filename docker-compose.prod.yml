# Production overrides. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Every secret below is REQUIRED: compose refuses to start if one is missing.
# Put TLS termination (nginx, Caddy, a cloud load balancer) in front of
# `backend` and `admin_dashboard`; nothing here serves HTTPS itself.
#
# Notes:
#  - `!reset` / `!override` need Docker Compose >= 2.24.
#  - Source bind mounts and --reload from the dev file are removed.

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis:
    ports: !reset []
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    restart: unless-stopped
    volumes: !reset []
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://smartride:${POSTGRES_PASSWORD}@postgres:5432/smartride
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (python -c "import secrets; print(secrets.token_hex(32))")}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS, e.g. ["https://admin.example.com"]}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN for Prometheus}
      # uvicorn only trusts X-Forwarded-For from these peers; set to your proxy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports: !override
      - "127.0.0.1:8000:8000"

  triage:
    restart: unless-stopped
    volumes: !reset []
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: !reset []

  admin_dashboard:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public API URL}
    ports: !override
      - "127.0.0.1:3000:3000"

  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
